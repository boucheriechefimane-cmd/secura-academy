name: Déploiement — Secura Academy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement vers WordPress
    runs-on: ubuntu-latest
    # Un déploiement bloqué (SSH qui traîne) doit s'arrêter tout seul.
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurer SSH
        env:
          WP_SSH_PRIVATE_KEY: ${{ secrets.WP_SSH_PRIVATE_KEY }}
          WP_KNOWN_HOSTS: ${{ secrets.WP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$WP_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$WP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Déployer le plugin et le thème
        env:
          WP_HOST: ${{ secrets.WP_HOST }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_PATH: ${{ secrets.WP_PATH }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
        run: bash scripts/deploy.sh
