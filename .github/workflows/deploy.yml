name: CI et déploiement — Secura Academy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Vérification PHP
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Vérifier la syntaxe des fichiers PHP
        run: |
          find wp-content tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Exécuter les tests de logique serveur
        run: php tests/smoke-test.php

      - name: Vérifier les espaces en fin de ligne
        run: |
          if grep -RIn '[[:blank:]]$' --include='*.php' --include='*.js' --include='*.css' wp-content ; then
            echo "::error::Espaces en fin de ligne détectés."
            exit 1
          fi

  deploy:
    name: Déploiement vers WordPress
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ secrets.WP_SITE_URL }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.WP_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.WP_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sauvegarder la version déployée
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.WP_SSH_USER }}@${{ secrets.WP_HOST }}" \
            "set -e; mkdir -p ~/secura-backups; tar -czf ~/secura-backups/secura-\$(date -u +%Y%m%d-%H%M%S).tar.gz \
            -C '${{ secrets.WP_PATH }}' wp-content/plugins/secura-academy wp-content/themes/secura-learning"

      - name: Synchroniser le plugin et le thème
        run: |
          set -euo pipefail
          target="${{ secrets.WP_SSH_USER }}@${{ secrets.WP_HOST }}"
          ssh_opts="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          rsync -az --delete --no-owner --no-group -e "$ssh_opts" \
            wp-content/plugins/secura-academy/ "$target:${{ secrets.WP_PATH }}/wp-content/plugins/secura-academy/"
          rsync -az --delete --no-owner --no-group -e "$ssh_opts" \
            wp-content/themes/secura-learning/ "$target:${{ secrets.WP_PATH }}/wp-content/themes/secura-learning/"

      - name: Vérifier que le site répond
        run: |
          curl -fsS --max-time 20 "${{ secrets.WP_SITE_URL }}" -o /dev/null -w 'HTTP %{http_code}\n'

      - name: Résumé
        if: always()
        run: |
          echo "Déploiement terminé. Vérifiez le tableau de bord Secura Academy sur ${{ secrets.WP_SITE_URL }}."
