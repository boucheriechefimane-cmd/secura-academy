name: WordPress — recette et compatibilité

# Ce workflow remplace le bac à sable local : il installe un vrai WordPress
# (avec MySQL en service), active le plugin et le thème du dépôt, puis
# vérifie que tout fonctionne vraiment.
#
# Trois choses sont testées :
#
#   1. compatibilite — la plateforme doit continuer de fonctionner quand
#      d'autres plugins sont installés (LiteSpeed Cache, Polylang, etc.) ;
#   2. compatibilite-complete — les plugins plus lourds, testés moins
#      souvent (le plan gratuit de GitHub ne fait qu'un job à la fois) ;
#   3. recette — la recette complète : WordPress + vraies machines Docker
#      + deux apprenants en parallèle + les 45 contrôles des machines.
#
# Le détail des contrôles est dans tools/recette-apprenants/wp-e2e.php et
# la matrice des plugins dans docs/COMPATIBILITE-PLUGINS.md.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: write # la preuve des machines est commitee dans la branche « preuve-machines »

concurrency:
  group: wordpress-${{ github.ref }}
  cancel-in-progress: true

env:
  SECA_WP_DIR: ${{ github.workspace }}/wp-ci
  SECA_WP_URL: http://localhost:8080
  SECA_LABS_PATH: ${{ github.workspace }}/labs
  SECA_DB_NAME: seca_wp
  SECA_DB_USER: seca
  SECA_DB_PASSWORD: seca_ci_pw
  SECA_DB_HOST: 127.0.0.1
  SECA_DB_PORT: 3306

jobs:
  # Les trois tests courts : à chaque push.
  compatibilite:
    name: Compatibilité — ${{ matrix.nom }}
    uses: ./.github/workflows/_compatibilite.yml
    strategy:
      matrix:
        include:
          - nom: 'WordPress seul'
            plugins: ''
          - nom: 'Polylang'
            plugins: 'polylang'
          - nom: 'LiteSpeed Cache'
            plugins: 'litespeed-cache'
    with:
      nom: ${{ matrix.nom }}
      plugins: ${{ matrix.plugins }}

  # Les plugins plus lourds : sur demande, en pull request, et chaque semaine.
  compatibilite-complete:
    name: Compatibilité — ${{ matrix.nom }}
    if: github.event_name != 'push'
    uses: ./.github/workflows/_compatibilite.yml
    strategy:
      matrix:
        include:
          - nom: 'Elementor'
            plugins: 'elementor'
          - nom: 'Contact Form 7'
            plugins: 'contact-form-7'
          - nom: 'WooCommerce'
            plugins: 'woocommerce'
    with:
      nom: ${{ matrix.nom }}
      plugins: ${{ matrix.plugins }}

  recette:
    name: Recette complète (WordPress + machines + deux élèves)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ${{ env.SECA_DB_NAME }}
          MYSQL_USER: ${{ env.SECA_DB_USER }}
          MYSQL_PASSWORD: ${{ env.SECA_DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: root_ci_pw
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer PHP et WP-CLI
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: wp-cli

      - name: Construire les machines
        run: |
          # Les machines que les rooms declarent, plus les prototypes du ZIP
          # (web-dvwa, secura-lab-blue-firewall, secura-lab-blue-log-analysis,
          # secura-lab-buffer-overflow) : ils doivent au moins se construire,
          # meme si leur contenu est une copie (voir labs/README.md).
          for machine in web-01 bin-01 multi-01 internal-01 univ-01 dojo-01 \
                         web-dvwa secura-lab-blue-firewall \
                         secura-lab-blue-log-analysis secura-lab-buffer-overflow; do
            echo "Construction de $machine…"
            docker build -q -t "securalabs/$machine:1.0" "labs/$machine"
            echo "OK  $machine"
          done
          echo "Construction du serveur de drapeaux (flags-01)…"
          docker build -q -t "securalabs/flags-01:1.0" labs/juice-shop/flags
          docker images --format '{{.Repository}}:{{.Tag}}' | tee /tmp/images.txt

      - name: Installer WordPress et le plugin
        run: bash scripts/ci-wordpress.sh

      - name: Démarrer le site
        run: |
          # Le routeur est indispensable : il envoie vers WordPress les
          # adresses que le serveur PHP ne sait pas servir seul
          # (/robots.txt, /llms.txt, les permaliens). C'est exactement ce
          # que fait un vrai hebergeur grace au fichier .htaccess.
          nohup php -S 0.0.0.0:8080 -t "$SECA_WP_DIR" scripts/audit/router.php > /tmp/serveur.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            if [ "$code" = "200" ]; then echo "Site en ligne (HTTP $code)"; exit 0; fi
            sleep 1
          done
          echo "Le site ne répond pas" >&2
          exit 1

      - name: Recette avec les vraies machines
        run: SECA_AVEC_MACHINE=1 wp --path="$SECA_WP_DIR" --allow-root eval-file tools/recette-apprenants/wp-e2e.php

      - name: Scénario des deux apprenants (isolation)
        run: |
          SECA_ROOM_WEB=$(wp --path="$SECA_WP_DIR" --allow-root post list --post_type=secura_room --name=securiser-une-application-web --field=ID)
          SECA_ROOM_NET=$(wp --path="$SECA_WP_DIR" --allow-root post list --post_type=secura_room --name=les-fondamentaux-du-reseau --field=ID)
          SECA_ROOM_BIN=$(wp --path="$SECA_WP_DIR" --allow-root post list --post_type=secura_room --name=memoire-et-defenses --field=ID)
          SECA_USER_ALICE=$(wp --path="$SECA_WP_DIR" --allow-root user get alice --field=ID)
          SECA_USER_BOB=$(wp --path="$SECA_WP_DIR" --allow-root user get bob --field=ID)
          echo "Rooms : web=$SECA_ROOM_WEB net=$SECA_ROOM_NET bin=$SECA_ROOM_BIN"
          echo "Apprenants : alice=$SECA_USER_ALICE bob=$SECA_USER_BOB"
          SECA_ROOM_WEB="$SECA_ROOM_WEB" SECA_ROOM_NET="$SECA_ROOM_NET" SECA_ROOM_BIN="$SECA_ROOM_BIN" \
          SECA_USER_ALICE="$SECA_USER_ALICE" SECA_USER_BOB="$SECA_USER_BOB" \
            python3 tools/recette-apprenants/scenario.py

      - name: Les 45 contrôles des machines
        run: bash scripts/test-labs-ci.sh 2>&1 | tee /tmp/machines.txt

      - name: La preuve des machines, room par room
        run: |
          set -o pipefail
          wp --path="$SECA_WP_DIR" --allow-root eval-file tools/recette-apprenants/preuve-machines.php \
            | tee /tmp/preuve-machines.txt
          # Le rapport est deja dans /tmp : l'etape echoue si une room ment,
          # mais on publie quand meme tout le detail.

      - name: La preuve au sommaire du travail
        if: always()
        run: |
          # Les artefacts (et leurs journaux) ne sont pas telechargeables
          # depuis ce bac a sable : le rapport doit donc atterrir dans le
          # sommaire du job, qui, lui, est lisible.
          {
            echo '## Preuve des machines, room par room'
            echo ''
            echo '```'
            sed -n '1,200p' /tmp/preuve-machines.txt 2>/dev/null || echo 'aucun rapport produit'
            echo '```'
            echo ''
            echo '## Les contrôles des machines (fin du journal)'
            echo ''
            echo '```'
            tail -40 /tmp/machines.txt 2>/dev/null || echo 'aucun journal'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Déposer la preuve dans le dépôt
        if: always()
        run: |
          # Ni les journaux de job ni les artefacts ne sont telechargeables
          # depuis le bac a sable du proprietaire (redirection Azure
          # bloquee). Le rapport est donc commite dans une branche dediee,
          # ou il reste lisible : « preuve-machines ».
          dossier="docs/preuves"
          mkdir -p "$dossier"
          date_du_jour=$(date -u +%Y-%m-%d)
          cp /tmp/preuve-machines.txt "$dossier/machines-$date_du_jour.txt" 2>/dev/null || true
          cp /tmp/machines.txt "$dossier/controles-machines-$date_du_jour.txt" 2>/dev/null || true
          {
            echo "# Preuve des machines du $date_du_jour"
            echo
            echo "Commit mesure : $GITHUB_SHA"
            echo "Travail : $GITHUB_RUN_ID"
            echo
            echo '```'
            sed -n '1,200p' /tmp/preuve-machines.txt 2>/dev/null || echo 'aucun rapport produit'
            echo '```'
          } > "$dossier/LISEZ-MOI.md"
          git config user.name 'Recette Secura'
          git config user.email 'recette@secura.invalid'
          git checkout -B preuve-machines
          git add "$dossier"
          git commit -q -m "Preuve des machines du $date_du_jour ($GITHUB_SHA)" || echo 'rien de neuf'
          git push --force origin HEAD:refs/heads/preuve-machines

      - name: Le lab web-dvwa (prototype du ZIP) démarre-t-il ?
        if: always()
        run: |
          # Pas de publication de port : le lab reste en reseau ferme,
          # comme chez l'apprenant. On verifie seulement qu'il demarre.
          docker rm -f seca_test_dvwa >/dev/null 2>&1 || true
          docker run -d --name seca_test_dvwa --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --cpus 1.0 \
            securalabs/web-dvwa:1.0
          sleep 8
          docker exec seca_test_dvwa sh -c 'ls /var/www/html >/dev/null' && echo "OK  web-dvwa : le contenu web est present"
          # Ce que la machine voit d'elle-meme : ports, outils, processus.
          echo '--- diagnostic web-01 ---'
          docker exec seca_test_dvwa sh -c '(command -v ss && ss -ltnp) || (command -v netstat && netstat -ltnp) || echo "ni ss ni netstat"'
          docker exec seca_test_dvwa sh -c 'command -v curl || echo "pas de curl"; command -v wget || echo "pas de wget"; command -v bash || echo "pas de bash"'
          docker exec seca_test_dvwa sh -c 'ps aux | head -10' || true
          docker exec seca_test_dvwa sh -c 'cat /var/log/app/apache.log | tail -20' || true
          for prototype in secura-lab-blue-firewall secura-lab-blue-log-analysis secura-lab-buffer-overflow; do
            docker run -d --name "seca_test_$prototype" --network none \
              --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1.0 \
              "securalabs/$prototype:1.0" >/dev/null
            sleep 6
            etat=$(docker inspect -f '{{.State.Running}}' "seca_test_$prototype")
            echo "$etat $prototype"
            docker rm -f "seca_test_$prototype" >/dev/null
          done
          docker rm -f seca_test_dvwa >/dev/null

      - name: Publier les preuves des machines
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preuves-machines
          path: |
            /tmp/machines.txt
            /tmp/preuve-machines.txt
            /tmp/images.txt
          if-no-files-found: warn

      - name: Chercher une erreur PHP fatale
        run: |
          journal="$SECA_WP_DIR/wp-content/debug.log"
          if [ -f "$journal" ] && grep -nE "Fatal error|Parse error|Uncaught" "$journal"; then
            echo "::error::Erreur PHP fatale pendant la recette"
            exit 1
          fi
          echo "Aucune erreur PHP fatale"

      - name: Conserver le journal PHP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journal-php-recette
          path: ${{ env.SECA_WP_DIR }}/wp-content/debug.log
          if-no-files-found: ignore
