name: WordPress — recette et compatibilité

# Ce workflow remplace le bac à sable local : il installe un vrai WordPress
# (avec MySQL en service), active le plugin et le thème du dépôt, puis
# vérifie que tout fonctionne vraiment.
#
# Trois choses sont testées :
#
#   1. compatibilite — la plateforme doit continuer de fonctionner quand
#      d'autres plugins sont installés (LiteSpeed Cache, Polylang, etc.) ;
#   2. compatibilite-complete — les plugins plus lourds, testés moins
#      souvent (le plan gratuit de GitHub ne fait qu'un job à la fois) ;
#   3. recette — la recette complète : WordPress + vraies machines Docker
#      + deux apprenants en parallèle + les 45 contrôles des machines.
#
# Le détail des contrôles est dans tools/recette-apprenants/wp-e2e.php et
# la matrice des plugins dans docs/COMPATIBILITE-PLUGINS.md.

# PHASE DE CONSTRUCTION (5 novembre 2026) : le CI ne tourne plus a chaque
# poussee. Une seule commande mesure tout, a la demande :
# « Machines — mesurer sans lancer le CI ». Le CI sera rebranche quand le
# socle sera termine, et il tournera alors sur la demande de fusion.
on:
  push:
    branches:
      - main
      # DECLENCHEUR TEMPORAIRE (retire dans le commit suivant) : le jeton
      # n'a pas le droit « actions: write », l'API refuse workflow_dispatch.
      - arena/a792cc4e-secura-academy
  workflow_dispatch:

permissions:
  contents: write # la preuve des machines est commitee dans la branche « preuve-machines »

concurrency:
  group: wordpress-${{ github.ref }}
  cancel-in-progress: true

env:
  SECA_WP_DIR: ${{ github.workspace }}/wp-ci
  SECA_WP_URL: http://localhost:8080
  SECA_LABS_PATH: ${{ github.workspace }}/labs
  SECA_DB_NAME: seca_wp
  SECA_DB_USER: seca
  SECA_DB_PASSWORD: seca_ci_pw
  SECA_DB_HOST: 127.0.0.1
  SECA_DB_PORT: 3306

jobs:
  # Les trois tests courts : à chaque push.
  compatibilite:
    name: Compatibilité — ${{ matrix.nom }}
    uses: ./.github/workflows/_compatibilite.yml
    strategy:
      matrix:
        include:
          - nom: 'WordPress seul'
            plugins: ''
          - nom: 'Polylang'
            plugins: 'polylang'
          - nom: 'LiteSpeed Cache'
            plugins: 'litespeed-cache'
    with:
      nom: ${{ matrix.nom }}
      plugins: ${{ matrix.plugins }}

  # Les plugins plus lourds : sur demande, en pull request, et chaque semaine.
  compatibilite-complete:
    name: Compatibilité — ${{ matrix.nom }}
    if: github.event_name != 'push'
    uses: ./.github/workflows/_compatibilite.yml
    strategy:
      matrix:
        include:
          - nom: 'Elementor'
            plugins: 'elementor'
          - nom: 'Contact Form 7'
            plugins: 'contact-form-7'
          - nom: 'WooCommerce'
            plugins: 'woocommerce'
    with:
      nom: ${{ matrix.nom }}
      plugins: ${{ matrix.plugins }}

  recette:
    name: Recette complète (WordPress + machines + deux élèves)
    runs-on: ubuntu-latest
    # Un MySQL reel (conteneur Docker mysql:8.0) : WordPress tourne sur une
    # vraie base, pas sur un substitut. La mesure manuelle des machines
    # (mesurer-les-machines.yml) utilise exactement le meme service.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ${{ env.SECA_DB_NAME }}
          MYSQL_USER: ${{ env.SECA_DB_USER }}
          MYSQL_PASSWORD: ${{ env.SECA_DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: root_ci_pw
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    timeout-minutes: 45
    steps:
      # Obligatoire avant toute action locale : GitHub lit
      # .github/actions/<nom>/action.yml dans le dossier de travail.
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: WordPress + machines + deux élèves + la preuve room par room
        uses: ./.github/actions/preuves-machines
        with:
          deposer_preuve: 'true'
          a_fusionner: 'true'
          branche_source: ${{ github.head_ref || github.ref_name }}

      - name: Conserver le journal PHP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journal-php-recette
          path: ${{ env.SECA_WP_DIR }}/wp-content/debug.log
          if-no-files-found: ignore
