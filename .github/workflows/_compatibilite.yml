name: Recette de compatibilité (réutilisable)

# Ce workflow est appelé par « wordpress.yml » pour chaque plugin tiers
# testé. Il installe un vrai WordPress, le plugin Secura Academy, le thème,
# puis le plugin à tester, et rejoue la recette complète.
#
# Il est réutilisable pour une raison simple : le plan gratuit de GitHub
# ne fait qu'un job à la fois, on veut donc pouvoir choisir بسهولة
# quels plugins tester à chaque push.

on:
  workflow_call:
    inputs:
      nom:
        description: 'Nom lisible du test'
        required: true
        type: string
      plugins:
        description: 'Slug(s) WordPress.org à installer (vide = aucun)'
        required: true
        type: string

permissions:
  contents: read

env:
  SECA_WP_DIR: ${{ github.workspace }}/wp-ci
  SECA_WP_URL: http://localhost:8080
  SECA_LABS_PATH: ${{ github.workspace }}/labs
  SECA_DB_NAME: seca_wp
  SECA_DB_USER: seca
  SECA_DB_PASSWORD: seca_ci_pw
  SECA_DB_HOST: 127.0.0.1
  SECA_DB_PORT: 3306

jobs:
  compatibilite:
    name: ${{ inputs.nom }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ${{ env.SECA_DB_NAME }}
          MYSQL_USER: ${{ env.SECA_DB_USER }}
          MYSQL_PASSWORD: ${{ env.SECA_DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: root_ci_pw
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer PHP et WP-CLI
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: wp-cli

      - name: Installer WordPress, le plugin et les plugins tiers
        run: bash scripts/ci-wordpress.sh ${{ inputs.plugins }}

      - name: Démarrer le site
        run: |
          # Le routeur est indispensable : il envoie vers WordPress les
          # adresses que le serveur PHP ne sait pas servir seul
          # (/robots.txt, /llms.txt, les permaliens). C'est exactement ce
          # que fait un vrai hebergeur grace au fichier .htaccess.
          nohup php -S 0.0.0.0:8080 -t "$SECA_WP_DIR" scripts/audit/router.php > /tmp/serveur.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            if [ "$code" = "200" ]; then echo "Site en ligne (HTTP $code)"; exit 0; fi
            sleep 1
          done
          echo "Le site ne répond pas" >&2
          tail -20 /tmp/serveur.log >&2
          exit 1

      - name: Le site répond dans les trois langues
        run: |
          for langue in fr ar en; do
            code=$(curl -s -o /tmp/page-$langue.html -w '%{http_code}' "http://localhost:8080/?seca_lang=$langue")
            echo "  $langue : HTTP $code"
            test "$code" = "200" || { echo "La page $langue ne respond pas" >&2; exit 1; }
          done
          grep -q 'dir="rtl"' /tmp/page-ar.html || { echo "La page arabe n'est pas en RTL" >&2; exit 1; }
          echo "  La page arabe est bien en ecriture de droite a gauche"

      - name: Recette de bout en bout
        run: wp --path="$SECA_WP_DIR" --allow-root eval-file tools/recette-apprenants/wp-e2e.php

      - name: Chercher une erreur PHP fatale
        run: |
          journal="$SECA_WP_DIR/wp-content/debug.log"
          if [ -f "$journal" ]; then
            if grep -nE "Fatal error|Parse error|Uncaught" "$journal"; then
              echo "::error::Erreur PHP fatale detectee avec les plugins : ${{ inputs.plugins }}"
              exit 1
            fi
            echo "Journal PHP : $(wc -l < "$journal") ligne(s), aucune erreur fatale"
          else
            echo "Aucune erreur PHP"
          fi

      - name: Conserver le journal PHP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journal-php-${{ inputs.nom }}
          path: ${{ env.SECA_WP_DIR }}/wp-content/debug.log
          if-no-files-found: ignore
