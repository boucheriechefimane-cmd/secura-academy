name: Audit externe — comité de 15 auditeurs

# Un comité d'audit externe, comme dans une organisation qui veut savoir
# ce que dira un regard neuf avant la mise en production.
#
# Chaque auditeur a sa spécialité et sa grille de contrôle :
#
#   seo        — le site est-il compris et indexable par les moteurs ?
#   contenu    — le contenu est-il complet, traduit, attribué, honnête ?
#   ux         — l'élève peut-il s'en servir sur un téléphone, en RTL ?
#   dev        — le code est-il propre, compatible, testé ?
#   securite   — les secrets, l'isolation, les en-têtes, la livraison ?
#
# Et les dix specialties du bloc T :
#
#   pedagogie          — l'élève apprend-il vraiment, et vers quelle certification ?
#   performance        — le site est-il rapide, et que ralentit-il ?
#   donnees-structurees— les moteurs et les IA peuvent-ils lire le site ?
#   accessibilite      — WCAG 2.2 AA : le site reste-t-il utilisable ?
#   multilingue        — FR / AR / EN : la traduction est-elle complète ?
#   rgpd               — que collecte-t-on d'un mineur, et peut-il sortir ?
#   moteur             — le moteur de lab fonctionne-t-il vraiment ?
#   onboarding         — le premier clic mène-t-il à un premier succès ?
#   licences           — ce qu'on reprend, sous quelle licence, avec quelle attribution ?
#   devops             — que se passe-t-il quand tout va mal ?
#
# Ils travaillent dans un vrai WordPress (MySQL + PHP), sur le site
# réellement rendu, et leurs rapports sont archivés comme des artefacts.
#
# Un constat « bloquant » fait échouer le job : c'est une barrière.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Un audit complet chaque semaine (le lundi à 6 h), comme un
    # contrôle qualité récurrent.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: audit-externe
  cancel-in-progress: true

jobs:
  audit:
    name: Audit externe (15 auditeurs, WordPress réel)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Le dossier du WordPress de recette : dans l'espace de travail
      # du runner (on ne peut pas ecrire dans /home/user sur GitHub).
      SECA_WP_DIR: ${{ github.workspace }}/wp-ci
      SECA_WP_URL: http://localhost:8080
      SECA_LABS_PATH: ${{ github.workspace }}/labs
      SECA_DB_NAME: seca_wp
      SECA_DB_USER: seca
      SECA_DB_PASSWORD: seca_ci_pw
      SECA_DB_HOST: 127.0.0.1
      SECA_DB_PORT: 3306

    services:
      mysql:
        image: mysql:8.0
        env:
          # Meme base et meme identifiants que la recette (scripts/ci-wordpress.sh).
          MYSQL_DATABASE: seca_wp
          MYSQL_USER: seca
          MYSQL_PASSWORD: seca_ci_pw
          MYSQL_ROOT_PASSWORD: root_ci_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer PHP et WP-CLI
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: wp-cli

      - name: Installer WordPress et le plugin
        run: bash scripts/ci-wordpress.sh

      - name: Démarrer le site
        run: |
          nohup php -S 0.0.0.0:8080 -t "$SECA_WP_DIR" scripts/audit/router.php > /tmp/serveur.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            if [ "$code" = "200" ]; then echo "Site en ligne (HTTP $code)"; exit 0; fi
            sleep 1
          done
          echo "Le site ne répond pas" >&2
          exit 1

      - name: Les quinze auditeurs passent au crible
        run: bash scripts/audit/run-audits.sh

      - name: Lister les rapports produits
        if: always()
        run: |
          mkdir -p docs/audits
          ls -la docs/audits/ || true

      - name: Archiver les rapports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rapports-audit-externe
          path: docs/audits/
          retention-days: 90

      - name: Résumé de l'audit
        if: always()
        run: |
          echo "## Comité d'audit externe — 15 auditeurs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Auditeur | Réussis | Bloquant | Majeur | Mineur | Info |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for fichier in docs/audits/*.json; do
            [ -f "$fichier" ] || continue
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print('| %s | %d | %d | %d | %d | %d |' % (d.get('titre',''),d.get('ok',0),d.get('bloquant',0),d.get('majeur',0),d.get('mineur',0),d.get('info',0)))" "$fichier" >> "$GITHUB_STEP_SUMMARY" || true
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Constats" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for fichier in docs/audits/*.md; do
            [ -f "$fichier" ] || continue
            echo "#### $(basename "$fichier" .md)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '/## Constats/,/## Verdict/p' "$fichier" | head -60 >> "$GITHUB_STEP_SUMMARY" || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
