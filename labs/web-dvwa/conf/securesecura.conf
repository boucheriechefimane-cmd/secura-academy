# Variante HTTPS de l'application (scénario « le certificat qui ne prouve
# rien ») : un certificat auto-signé, donc non fiable par construction.
<VirtualHost *:8443>
	ServerName intranet.lab
	DocumentRoot /var/www/html

	SSLEngine on
	SSLCertificateFile /etc/ssl/secura/cert.pem
	SSLCertificateKeyFile /etc/ssl/secura/key.pem
</VirtualHost>
