# Machine 3 — réseau à deux nœuds
#
# But pédagogique : l'apprenant attaquant doit comprendre qu'une cible peut
# mener à une autre. Le noeud « web » est la machine visible ; le noeud
# « internal » n'est joignable que depuis le réseau du lab et contient le
# second drapeau.
#
# Construction :
#   docker compose -f labs/net-01/docker-compose.yml build
# Lancement (par le plugin) :
#   docker compose -f labs/net-01/docker-compose.yml -p seca_lab_<apprenant>_<room> up -d
#
# Le plugin fournit les variables SECA_LAB_USER, SECA_LAB_ROOM, SECA_LAB_PROJECT
# et SECA_LAB_COMPOSE : chaque service est labellisé, ce qui permet au
# nettoyage automatique de retrouver la pile d'un apprenant et de la démonter.
#
# Aucun nom de conteneur fixe : Compose nomme les conteneurs
# <projet>-<service>-1, donc deux apprenants ne se gênent jamais.
#
# L'apprenant travaille dans le service « attacker » et touche « web »,
# puis « internal » une fois le premier indicateur trouvé.

services:
  attacker:
    build:
      context: ../web-01
    hostname: attacker
    user: "1000:1000"
    labels:
      - "seca.lab=1"
      - "seca.lab.user=${SECA_LAB_USER:-0}"
      - "seca.lab.room=${SECA_LAB_ROOM:-0}"
      - "seca.lab.project=${SECA_LAB_PROJECT:-}"
      - "seca.lab.compose=${SECA_LAB_COMPOSE:-}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - seca_lab
    entrypoint: ["/bin/bash", "-c"]
    command: ["sleep infinity"]
    stdin_open: true
    tty: true

  web:
    build:
      context: ../web-01
    hostname: web
    user: "1000:1000"
    labels:
      - "seca.lab=1"
      - "seca.lab.user=${SECA_LAB_USER:-0}"
      - "seca.lab.room=${SECA_LAB_ROOM:-0}"
      - "seca.lab.project=${SECA_LAB_PROJECT:-}"
      - "seca.lab.compose=${SECA_LAB_COMPOSE:-}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - seca_lab
    environment:
      - DB_HOST=db

  db:
    build:
      context: ../web-01
    hostname: db
    user: "1000:1000"
    labels:
      - "seca.lab=1"
      - "seca.lab.user=${SECA_LAB_USER:-0}"
      - "seca.lab.room=${SECA_LAB_ROOM:-0}"
      - "seca.lab.project=${SECA_LAB_PROJECT:-}"
      - "seca.lab.compose=${SECA_LAB_COMPOSE:-}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - seca_lab
    environment:
      - DB_HOST=db
    command: ["sleep", "infinity"]
    entrypoint: ["/bin/bash", "-c"]

  internal:
    build:
      context: ../web-01
    hostname: internal
    user: "1000:1000"
    labels:
      - "seca.lab=1"
      - "seca.lab.user=${SECA_LAB_USER:-0}"
      - "seca.lab.room=${SECA_LAB_ROOM:-0}"
      - "seca.lab.project=${SECA_LAB_PROJECT:-}"
      - "seca.lab.compose=${SECA_LAB_COMPOSE:-}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - seca_lab
    command: ["sleep", "infinity"]
    entrypoint: ["/bin/bash", "-c"]

networks:
  # Réseau sans sortie Internet : les conteneurs ne parlent qu'entre eux.
  # Compose le préfixe par le nom du projet, donc un réseau par apprenant.
  seca_lab:
    driver: bridge
    internal: true
